name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          rust-components: rustfmt, clippy
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
