name: Semantic Branch Name

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches:
      - "main"

jobs:
  check-branch-name:
    name: Validate branch name
    runs-on: ubuntu-slim
    steps:
      # Alternative: https://github.com/commit-check/commit-check-action
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Handle Dependabot branches separately
          if [[ "${BRANCH_NAME}" == dependabot/* ]]; then
            echo "✅ Dependabot branch '${BRANCH_NAME}' is valid."
            exit 0
          fi

          # Allowed semantic prefixes
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9._-]+$"

          if [[ ! "${BRANCH_NAME}" =~ ${REGEX} ]]; then
            echo "❌ Branch name '${BRANCH_NAME}' does not follow the semantic naming convention."
            echo ""
            echo "Required format: <prefix>/<description>"
            echo "Allowed prefixes: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Example: feat/user-authentication"
            echo ""
            echo "See Conventional Branch specification: https://conventional-branch.github.io/"
            echo ""
            echo "Please rename your branch to match the convention."
            exit 1
          else
            echo "✅ Branch name '${BRANCH_NAME}' is valid."
          fi
