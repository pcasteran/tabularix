name: "Setup Toolchain"
description: "Checks out the repository, installs toolchains via mise, and sets up the Rust toolchain."

inputs:
  rust-components:
    description: "Comma-separated list of Rust components to install (e.g. rustfmt, clippy)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install toolchains via mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        install_args: "--locked"

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}
