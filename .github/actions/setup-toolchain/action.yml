name: "Setup Toolchain"
description: "Checks out the repository, installs toolchains via mise, and sets up the Rust toolchain."

inputs:
  rust-components:
    description: "Comma-separated list of Rust components to install (e.g. rustfmt, clippy)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install toolchains via mise
      uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      with:
        install: true
        install_args: "--locked"

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}
