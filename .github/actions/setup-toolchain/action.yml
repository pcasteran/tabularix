name: "Setup Toolchain"
description: "Checks out the repository, installs toolchains via mise, and sets up the Rust toolchain."

inputs:
  rust-components:
    description: "Comma-separated list of Rust components to install (e.g. rustfmt, clippy)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install toolchains via mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        install: true
        install_args: "--locked"

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}
