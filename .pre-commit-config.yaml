auto_update:
  cooldown_days: 7

repos:
  - repo: local
    hooks:
      - id: prek-check-hooks
        name: prek check
        entry: prek auto-update --check
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.agents/skills
      - id: end-of-file-fixer
        exclude: ^\.agents/skills
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^(.devcontainer/devcontainer.json|.vscode/launch.json|.vscode/settings.json)
      - id: check-added-large-files
        args: ["--maxkb=2500"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: ^\.agents/skills
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-ast
      - id: mixed-line-ending

  - repo: https://github.com/instrumentl/pre-commit-just
    rev: v0.1
    hooks:
      - id: format-justfile

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.1
    hooks:
      - id: prettier
        exclude: ^\.agents/skills
        types_or: [markdown, json, yaml, toml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Linter
      - id: ruff-check
        types_or: [python, pyi, jupyter, pyproject]
        args: [--fix]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.54
    hooks:
      - id: ty

  - repo: https://github.com/tweag/FawltyDeps
    rev: v0.20.0
    hooks:
      - id: check-undeclared
      - id: check-unused

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--", "--check"]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
        args:
          [
            "--all-targets",
            "--all-features",
            "--",
            "-D",
            "warnings",
            "-W",
            "clippy::pedantic",
          ]

  - repo: https://github.com/MarketSquare/robotframework-robocop
    # Robocop version.
    rev: v8.3.2
    hooks:
      # Run the linter.
      - id: robocop
      # Run the formatter.
      - id: robocop-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
